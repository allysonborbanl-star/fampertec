{% extends "base.html" %}

{% block title %}{% if aviso %}Editar Aviso{% else %}Quadro de Avisos{% endif %} | Fampertec{% endblock %}

{% block content %}
  <h1>{% if aviso %}Editar Aviso{% else %}Quadro de Avisos{% endif %}</h1>
  <p class="muted">Preencha os dados abaixo.</p>

  <form method="post" class="form{% if aviso %} form--editar-quadro-aviso{% else %} form--cadastro-quadro-aviso{% endif %}" enctype="multipart/form-data">
    {% csrf_token %}

    <div class="form__grid">
      <label class="field">
        <span class="field__label">{{ form.titulo.label }}</span>
        {{ form.titulo }}
        {% if form.titulo.errors %}<span class="field__error">{{ form.titulo.errors|striptags }}</span>{% endif %}
      </label>

      <label class="field">
        <span class="field__label">{{ form.data_fim_publicacao.label }}</span>
        {{ form.data_fim_publicacao }}
        {% if form.data_fim_publicacao.errors %}<span class="field__error">{{ form.data_fim_publicacao.errors|striptags }}</span>{% endif %}
      </label>

      <label class="field field--link">
        <span class="field__label">{{ form.link.label }}</span>
        {{ form.link }}
        {% if form.link.errors %}<span class="field__error">{{ form.link.errors|striptags }}</span>{% endif %}
      </label>

      <label class="field field--file">
        <span class="field__label">{{ form.imagem_capa.label }}</span>
        {{ form.imagem_capa }}
        {% if form.imagem_capa.errors %}<span class="field__error">{{ form.imagem_capa.errors|striptags }}</span>{% endif %}
      </label>

      <label class="field field--file field--full field--file-plus">
        <span class="field__label">Imagem</span>
        <div class="field__control field__control--inline">
          <div class="field__files" id="quadro-aviso-imagem-files">
            <input type="file" name="imagens" accept="image/*" multiple />
          </div>
          <button class="btn btn--ghost btn--icon" type="button" id="add-quadro-aviso-imagem" aria-label="Adicionar imagem">+</button>
        </div>
      </label>

      <label class="field field--file field--full field--file-plus">
        <span class="field__label">Documento</span>
        <div class="field__control field__control--inline">
          <div class="field__files" id="quadro-aviso-documento-files">
            <input type="file" name="documentos" multiple />
          </div>
          <button class="btn btn--ghost btn--icon" type="button" id="add-quadro-aviso-documento" aria-label="Adicionar documento">+</button>
        </div>
      </label>

      <label class="field">
        <span class="field__label">{{ form.visualizacao.label }}</span>
        {{ form.visualizacao }}
        {% if form.visualizacao.errors %}<span class="field__error">{{ form.visualizacao.errors|striptags }}</span>{% endif %}
      </label>

      <label class="field field--full">
        <span class="field__label">{{ form.descricao.label }}</span>
        {{ form.descricao }}
        {% if form.descricao.errors %}<span class="field__error">{{ form.descricao.errors|striptags }}</span>{% endif %}
      </label>
    </div>

    <div class="form__actions">
      <button class="btn" type="submit">Salvar</button>
      <a class="btn btn--ghost" href="{% url 'lista_quadro_avisos' %}">Voltar</a>
    </div>
  </form>

  <script>
    (function () {
      var addBtn = document.getElementById("add-quadro-aviso-imagem");
      if (!addBtn) return;
      addBtn.addEventListener("click", function () {
        var wrapper = document.getElementById("quadro-aviso-imagem-files");
        if (!wrapper) return;
        var input = document.createElement("input");
        input.type = "file";
        input.name = "imagens";
        input.accept = "image/*";
        wrapper.appendChild(input);
        input.focus();
      });

      var addDocumentoBtn = document.getElementById("add-quadro-aviso-documento");
      if (!addDocumentoBtn) return;
      addDocumentoBtn.addEventListener("click", function () {
        var wrapper = document.getElementById("quadro-aviso-documento-files");
        if (!wrapper) return;
        var input = document.createElement("input");
        input.type = "file";
        input.name = "documentos";
        wrapper.appendChild(input);
        input.focus();
      });
    })();
  </script>
{% endblock %}
