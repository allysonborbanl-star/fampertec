{% extends "base.html" %}

{% block title %}{% if evento %}Editar Evento{% else %}Eventos{% endif %} | Fampertec{% endblock %}

{% block content %}
  <h1>{% if evento %}Editar Evento{% else %}Eventos{% endif %}</h1>
  <p class="muted">Preencha os dados abaixo.</p>

  <form method="post" class="form{% if evento %} form--editar-evento{% endif %}" enctype="multipart/form-data">
    {% csrf_token %}

    <div class="form__grid">
      <label class="field">
        <span class="field__label">{{ form.data_inicio.label }}</span>
        {{ form.data_inicio }}
        {% if form.data_inicio.errors %}<span class="field__error">{{ form.data_inicio.errors|striptags }}</span>{% endif %}
      </label>

      <label class="field">
        <span class="field__label">{{ form.horario_inicio.label }}</span>
        {{ form.horario_inicio }}
        {% if form.horario_inicio.errors %}<span class="field__error">{{ form.horario_inicio.errors|striptags }}</span>{% endif %}
      </label>

      <label class="field">
        <span class="field__label">{{ form.data_final.label }}</span>
        {{ form.data_final }}
        {% if form.data_final.errors %}<span class="field__error">{{ form.data_final.errors|striptags }}</span>{% endif %}
      </label>

      <label class="field">
        <span class="field__label">{{ form.horario_final.label }}</span>
        {{ form.horario_final }}
        {% if form.horario_final.errors %}<span class="field__error">{{ form.horario_final.errors|striptags }}</span>{% endif %}
      </label>

      <label class="field">
        <span class="field__label">{{ form.evento.label }}</span>
        {{ form.evento }}
        {% if form.evento.errors %}<span class="field__error">{{ form.evento.errors|striptags }}</span>{% endif %}
      </label>

      <label class="field">
        <span class="field__label">{{ form.local.label }}</span>
        {{ form.local }}
        {% if form.local.errors %}<span class="field__error">{{ form.local.errors|striptags }}</span>{% endif %}
      </label>

      <label class="field field--file">
        <span class="field__label">{{ form.imagem_capa.label }}</span>
        {{ form.imagem_capa }}
        {% if form.imagem_capa.errors %}<span class="field__error">{{ form.imagem_capa.errors|striptags }}</span>{% endif %}
      </label>

      <label class="field field--file field--full field--file-plus">
        <span class="field__label">Imagem</span>
        <div class="field__control field__control--inline">
          <div class="field__files" id="evento-imagem-files">
            <input type="file" name="imagens" accept="image/*" multiple />
          </div>
          <button class="btn btn--ghost btn--icon" type="button" id="add-evento-imagem" aria-label="Adicionar imagem">+</button>
        </div>
      </label>

      <label class="field field--file field--full field--file-plus">
        <span class="field__label">Documento</span>
        <div class="field__control field__control--inline">
          <div class="field__files" id="evento-documento-files">
            <input type="file" name="documentos" multiple />
          </div>
          <button class="btn btn--ghost btn--icon" type="button" id="add-evento-documento" aria-label="Adicionar documento">+</button>
        </div>
      </label>

      <label class="field">
        <span class="field__label">{{ form.visualizacao.label }}</span>
        {{ form.visualizacao }}
        {% if form.visualizacao.errors %}<span class="field__error">{{ form.visualizacao.errors|striptags }}</span>{% endif %}
      </label>

      <label class="field field--full">
        <span class="field__label">{{ form.descricao.label }}</span>
        {{ form.descricao }}
        {% if form.descricao.errors %}<span class="field__error">{{ form.descricao.errors|striptags }}</span>{% endif %}
      </label>
    </div>

    <div class="form__actions">
      <button class="btn" type="submit">Salvar</button>
      <a class="btn btn--ghost" href="{% url 'lista_eventos' %}">Voltar</a>
    </div>
  </form>

  <script>
    (function () {
      var addBtn = document.getElementById("add-evento-imagem");
      if (!addBtn) return;
      addBtn.addEventListener("click", function () {
        var wrapper = document.getElementById("evento-imagem-files");
        if (!wrapper) return;
        var input = document.createElement("input");
        input.type = "file";
        input.name = "imagens";
        input.accept = "image/*";
        wrapper.appendChild(input);
        input.focus();
      });

      var addDocumentoBtn = document.getElementById("add-evento-documento");
      if (!addDocumentoBtn) return;
      addDocumentoBtn.addEventListener("click", function () {
        var wrapper = document.getElementById("evento-documento-files");
        if (!wrapper) return;
        var input = document.createElement("input");
        input.type = "file";
        input.name = "documentos";
        wrapper.appendChild(input);
        input.focus();
      });
    })();
  </script>
{% endblock %}
